name: PigRider image

# Fork workflow (apple/docs/server.md). Every push to main builds the server
# image (upstream's Dockerfile: server, client and routes), runs it the way
# Unraid does, and pushes ghcr.io/maroge1990/pigrider:sha-<commit>. There is no
# :latest: Unraid follows :release, which only pigrider-release.yml moves.
# A manual run on another branch pushes :sha-<commit> only (for trying a branch).
# Pull requests build and smoke-test the image but push nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# One group per commit on main, so a newer push never replaces a queued build
# (every main commit gets its image); a pull request's newer push cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/maroge1990/pigrider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Stamp the build
        id: stamp
        run: echo "date=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Build the candidate (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pigrider:candidate
          labels: |
            org.opencontainers.image.title=PigRider
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OPENRADLR_BUILD_SHA=${{ github.sha }}
            OPENRADLR_BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same user, read-only root and dropped capabilities as the Unraid template.
      - name: Smoke-test the candidate as Unraid runs it
        run: apple/deploy/smoke-test.sh pigrider:candidate

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag pigrider:candidate "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
